<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
<h2>Admin Dashboard</h2>
<h3>Users</h3>
<ul>
{% for user in users %}
  <li>{{ user[1] }} ({{ user[2] }}) - {{ user[3] }}</li>
{% endfor %}
</ul>
<h3>Transactions</h3>
<ul>
{% for txn in transactions %}
  <li>{{ txn[5] }} - {{ txn[2] }} {{ txn[3] }} ({{ txn[4] }})</li>
{% endfor %}
</ul>
</body>
</html>
